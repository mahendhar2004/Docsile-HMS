paths:
  # ================================================================
  # auth (3 endpoints)
  # ================================================================
  /auth/login:
    post:
      tags: [auth]
      summary: Staff login
      description: |
        Email + password authentication. Issues a 15-min HttpOnly access token cookie and
        a 7-day HttpOnly refresh token cookie. Rate limit: 5 req/min per client IP.
      x-permission: public
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Login successful — access_token and refresh_token cookies set.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          userId:
                            type: string
                          name:
                            type: string
                          role:
                            type: string
                          hospitalId:
                            type: string
        '401':
          description: Invalid credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Rate limit exceeded (5 req/min per IP).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh:
    post:
      tags: [auth]
      summary: Refresh access token
      description: |
        Refresh token rotation. The existing refresh_token cookie is validated, its jti is
        revoked in token_revocation, and a new access + refresh token pair is issued.
        Rate limit: 30 req/min per user jti.
      x-permission: cookie-only
      responses:
        '200':
          description: New token pair issued — cookies updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Refresh token missing, expired, or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      tags: [auth]
      summary: Logout
      description: |
        Inserts the access and refresh token jtis into token_revocation (true server-side
        revocation). Clears both HttpOnly cookies.
      x-permission: cookie-only
      responses:
        '200':
          description: Logout successful — both token cookies cleared.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'

