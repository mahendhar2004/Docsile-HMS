          enum: [admitted, discharged]
        ward:
          type: string
          nullable: true
        bedNumber:
          type: string
          nullable: true
        onDutyDoctors:
          type: string
          description: JSON-encoded array of doctor names
        paymentRecords:
          type: string
          description: JSON-encoded array of payment records
        prescriptions:
          type: string
          description: JSON-encoded array of prescription references
        hospitalId:
          type: string
          readOnly: true
        createdById:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    InsuranceCompany:
      type: object
