          type: string
          format: date-time

    InsuranceClaim:
      type: object
      properties:
        id:
          type: string
        claimNumber:
          type: string
          description: Sequential claim number, generated by next_insurance_claim_number()
        inPatientId:
          type: string
        insuranceCompanyId:
          type: string
          nullable: true
        status:
          type: string
          description: e.g. submitted, approved, rejected, settled
        claimedAmount:
          type: number
          format: double
        approvedAmount:
          type: number
          format: double
          nullable: true
        settledAmount:
          type: number
          format: double
          nullable: true
        hospitalId:
          type: string
          readOnly: true
        createdById:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    Lab:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        printHeaderKey:
          type: string
          nullable: true
        hospitalId:
          type: string
          readOnly: true
        createdAt:
          type: string
          format: date-time
        isDeleted:
          type: boolean

    InvestigationMaster:
      type: object
      properties:
