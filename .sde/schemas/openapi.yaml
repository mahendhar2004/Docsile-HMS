  /call-logs/webhook/exotel:
    post:
      tags: [call-logs]
      summary: Exotel call webhook (token-authenticated, no JWT)
      description: |
        Receives real-time call events from Exotel. Authentication is via a shared
        webhook token — a simple string comparison against the EXOTEL_WEBHOOK_TOKEN
        environment variable, not JWT and not an HMAC signature. The token may be
        supplied either as the `X-Exotel-Token` request header, or as a `token` URL
        query parameter (Exotel's own webhook config supports either). Accepts both
        `application/json` and `application/x-www-form-urlencoded` (Exotel sends
        form-encoded). Rate limit: unrestricted — token-validated only.

        KNOWN ISSUE (tracked as H-2 in 0-analysis.md, must be fixed during this
        endpoint's implementation, not carried forward as-is): in the current
        Next.js implementation, if EXOTEL_WEBHOOK_TOKEN is unset in the
        environment, the token check is skipped entirely and the endpoint accepts
        unauthenticated requests. The Edge Function implementation must make the
        token check unconditional — fail closed (401) if the env var itself is
        missing, never fail open.
      x-permission: token-only
      parameters:
        - name: token
          in: query
          required: false
          schema:
            type: string
          description: >-
            Webhook token, if not supplied via the X-Exotel-Token header instead.
            One of the two is required.
        - name: X-Exotel-Token
          in: header
          required: false
          schema:
            type: string
          description: Webhook token, if not supplied via the token query parameter instead.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
          application/x-www-form-urlencoded:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Webhook received and processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '401':
          description: Invalid or missing webhook token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

