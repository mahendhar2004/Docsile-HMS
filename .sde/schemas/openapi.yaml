openapi: '3.0.3'
info:
  title: Docsile HMS API
  version: '1.0.0'
  description: |
    Hospital Management System REST API — 234 endpoints across 18 Supabase Edge Function modules.

    **Auth:** All authenticated endpoints require a valid HttpOnly `access_token` cookie (15-min expiry),
    issued by `POST /auth/login` and refreshed by `POST /auth/refresh`. The cookie is set by the server
    and is not visible to JavaScript.

    **Rate limits (default 100 req/min per user):**
    - `POST /auth/login`: 5 req/min per client IP
    - `POST /auth/refresh`: 30 req/min per user jti
    - `GET /analytics/*`: 30 req/min per user
    - `GET /reports/exports/*`: 10 req/min per user
    - `POST /call-logs/sync`: 6 req/min per user
    - `POST /call-logs/webhook/exotel`: unrestricted (token-validated)
    - `GET /health*`: 60 req/min per IP
    - All other authenticated endpoints: 100 req/min per user

    Rate limit headers on authenticated responses: `X-RateLimit-Limit`, `X-RateLimit-Remaining`, `X-RateLimit-Reset`.

    **Response envelope:** Every response — success or error — is wrapped:
    ```json
    { "statusCode": 200, "message": "Success", "data": { ... }, "meta": { ... } }
    ```
    `meta` (pagination) is omitted for non-paginated responses. Error responses set `data: null`.

    **Permissions:** Each operation carries an `x-permission` extension with the required RBAC scope
    (enforced by Hono middleware in every Edge Function per ADR-002). Every `x-permission` value
    below matches an EXISTING key in `src/lib/permissions.ts`'s `ALL_PERMISSIONS`, with three
    exceptions — `billing:*`, `call_logs:*`, and `queue:view` — which are NEW permission groups that
    do not exist in the current codebase yet (billing and queue are new module boundaries created by
    this migration; call-logs functionality currently has no dedicated permission at all — access is
    gated only by generic auth today). These three groups MUST be added to `ALL_PERMISSIONS` and to
    the relevant `DEFAULT_ROLE_PERMISSIONS` role arrays during Phase 6/7 implementation, before their
    Edge Functions can enforce anything — until then, do not treat their presence in this spec as
    confirmation that the permission already exists in code.

servers:
  - url: https://{projectRef}.supabase.co/functions/v1
    description: >-
      Supabase's REST gateway for Edge Functions. Path segments after this
      base (e.g. /patient-care/patients) select the target Edge Function
      by name (one per module, per ADR-006) and the route within it. The
      "v1" here is Supabase's own platform path prefix, not this project's
      API version — this project has no separate API versioning scheme yet;
      introduce one via distinct function names (e.g. a "v2-patient-care"
      function) if a breaking change is ever needed for a single module.
    variables:
      projectRef:
        default: YOUR_PROJECT_REF
        description: Supabase project reference ID

security:
  - cookieAuth: []

tags:
  - name: doctor
    description: >-
      Clinical workflow operations (queue, consultation, workup, AI assist).
      Doctor entity records themselves are NOT managed here — there is no
      standalone Doctor table; a doctor is a User (staff/actions.ts) with
      role=DOCTOR. Doctor provisioning/CRUD is handled entirely by the
      staff module's endpoints (POST /staff/members, etc.), not this tag.
  - name: labs
    description: >-
      Lab test ordering and lab-center/master-data management. Recording
      lab RESULTS (as opposed to ordering a test) is explicitly deferred —
      not yet designed as an endpoint in this phase; add it when that
      workflow is implemented, rather than assuming it is covered here.
  - name: reports
    description: >-
      Report/export data queries (all read endpoints in this phase). PDF
      generation/storage for reports is explicitly deferred — not yet
      designed as an endpoint; add it when that workflow (client-side vs.
      server-generated PDFs) is decided, rather than assuming it is covered
      here.

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: |
        HttpOnly JWT access token (15-min expiry). Issued by POST /auth/login.
        Rotated via POST /auth/refresh (refresh token rotation — old refresh jti is invalidated
        on every use and stored hashed in token_revocation table).

  parameters:
    page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
      description: Page number (1-based) for offset pagination.
    pageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
      description: Number of records per page for offset pagination.
    cursor:
      name: cursor
      in: query
      schema:
        type: string
      description: Opaque cursor token for cursor-based pagination. Omit for the first page.
    cursorLimit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
      description: Number of records per page for cursor-based pagination.
    analyticsFilter:
      name: filter
      in: query
      schema:
        type: string
        enum: [today, week, month, year, custom]
        default: today
      description: Date range filter for analytics and reports endpoints.
    customStart:
      name: customStart
      in: query
      schema:
        type: string
        format: date
      description: Start date (YYYY-MM-DD). Required when filter=custom.
    customEnd:
      name: customEnd
      in: query
      schema:
        type: string
        format: date
      description: End date (YYYY-MM-DD). Required when filter=custom.
    pathId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Resource UUID.
    patientId:
      name: patientId
      in: path
      required: true
      schema:
        type: string
      description: Patient UUID (internal `id`, not the sequential `patientId` display field).
    inpatientId:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: InPatient UUID.

  schemas:
    # ---- Envelope & Error ----
    PaginatedMeta:
      type: object
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer

    ApiResponse:
      type: object
      required: [statusCode, message, data]
      properties:
        statusCode:
          type: integer
          example: 200
        message:
          type: string
          example: Success
        data:
          type: object
          nullable: true
          description: Response payload — shape varies per endpoint.
        meta:
          $ref: '#/components/schemas/PaginatedMeta'

    ErrorResponse:
      type: object
      required: [statusCode, message, data]
      properties:
        statusCode:
          type: integer
          example: 400
        message:
          type: string
          example: 'Patient with id P-1234 not found'
          description: >
            Descriptive error message naming the resource type, identifier, and what was invalid.
            Never returns a bare "Not found" or "Bad request".
        data:
          type: object
          nullable: true
          default: null

    # ---- Entity Schemas (derived from 4-datamodel.md) ----
    Patient:
      type: object
      properties:
        id:
          type: string
          description: UUID primary key
        patientId:
          type: string
          description: Sequential human-readable ID (e.g. P-0001), generated by next_patient_number()
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        email:
          type: string
          nullable: true
        gender:
          type: string
          enum: [Male, Female, Other]
        dateOfBirth:
          type: string
          format: date
          nullable: true
        address:
          type: string
          nullable: true
        patientType:
          type: string
          description: e.g. OPD, IPD, Walk-in
        appointmentDate:
          type: string
          format: date
        status:
          type: string
          nullable: true
        referredBy:
          type: string
          nullable: true
        createdById:
          type: string
          nullable: true
        hospitalId:
          type: string
          readOnly: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    Prescription:
      type: object
      properties:
        id:
          type: string
        prescriptionNumber:
          type: string
          description: Sequential prescription ID (e.g. 2026-0001), generated by next_prescription_number()
        patientId:
          type: string
          description: FK to Patient.patientId (sequential display ID, not UUID)
        doctorId:
          type: string
          nullable: true
        prescriptionDate:
          type: string
          format: date
        medicines:
          type: string
          description: JSON-encoded array of prescribed medicines
        investigations:
          type: string
          description: JSON-encoded array of investigations ordered
        diagnosis:
          type: string
          nullable: true
        heightCm:
          type: number
          format: double
          nullable: true
        weightKg:
          type: number
          format: double
          nullable: true
        hospitalId:
          type: string
          readOnly: true
        createdAt:
          type: string
          format: date-time

    InvoiceItem:
      type: object
      properties:
        id:
          type: string
        prescriptionId:
          type: string
        name:
          type: string
        quantity:
          type: integer
        unitPrice:
          type: number
          format: double
        total:
          type: number
          format: double

    Payment:
      type: object
      properties:
        id:
          type: string
        prescriptionId:
          type: string
        paymentMode:
          type: string
          description: e.g. Cash, Card, UPI
        amount:
          type: number
          format: double
        createdAt:
          type: string
          format: date-time

    InPatient:
      type: object
      properties:
        id:
          type: string
        ipNumber:
          type: string
          description: Sequential IP number (e.g. IP-0001), generated by next_ip_number()
        patientId:
          type: string
          description: FK to Patient.id (UUID)
        admissionDate:
          type: string
